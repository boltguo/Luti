name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.configuration }})
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: |
          # Hosted runners isolate the production identity used by Release tests.
          tests=()
          if [[ "${{ matrix.configuration }}" == "Release" ]]; then
            tests+=(
              -only-testing:LutiTests/ProjectEnablementTests
              -only-testing:LutiTests/ConnectionProviderTests
              -only-testing:LutiTests/ConnectionRuntimeTests
              -only-testing:LutiTests/ReleaseReadinessTests
            )
          fi
          xcodebuild test \
            -project Luti.xcodeproj \
            -scheme Luti \
            -configuration "${{ matrix.configuration }}" \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath .build/DerivedData \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile \
            "${tests[@]}" \
            ENABLE_TESTABILITY=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
