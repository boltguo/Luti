<!doctype html>
<!-- Render at 1200×630 to export og-image.png. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: var(--font); color: var(--on-surface);
    background: var(--surface);
    -webkit-font-smoothing: antialiased;
  }
  .og {
    position: relative; width: 100%; height: 100%;
    padding: 64px 88px; display: flex; flex-direction: column; justify-content: space-between;
    background:
      radial-gradient(1100px 520px at 108% -10%, color-mix(in srgb, var(--primary) 20%, transparent), transparent 62%),
      radial-gradient(760px 420px at -8% 112%, color-mix(in srgb, var(--primary) 11%, transparent), transparent 64%),
      var(--surface);
  }
  .og::after {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(color-mix(in srgb, var(--primary) 7%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--primary) 7%, transparent) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: linear-gradient(105deg, #000 0 34%, transparent 72%);
  }
  .og > * { position: relative; z-index: 1; }

  .brand { display: flex; align-items: center; gap: 15px; font-size: 28px; font-weight: 600; letter-spacing: -0.015em; }
  .brand img { width: 54px; height: 54px; border-radius: 14px; }

  h1 { margin: 0; font-size: 74px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.04; }
  h1 em { font-style: normal; color: var(--primary); }
  p { margin: 22px 0 0; max-width: 34ch; font-size: 25px; line-height: 1.4; color: var(--on-surface-variant); }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .pills { display: flex; gap: 12px; }
  .pill {
    padding: 10px 18px; border-radius: 999px; font-size: 17.5px; font-weight: 500;
    color: var(--on-surface-variant);
    background: color-mix(in srgb, var(--primary) 7%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--primary) 20%, transparent);
  }
  .dom { font-family: var(--font-mono); font-size: 23px; color: var(--primary); }
</style>
</head>
<body>
  <div class="og">
    <div class="brand"><img src="luti-icon.png" alt="">Luti</div>
    <div>
      <h1>Cloud AI.<br><em>On your Mac.</em></h1>
      <p>Local code, tests and apps. Shared project memory across compatible MCP clients.</p>
    </div>
    <div class="row">
      <div class="pills">
        <span class="pill">Open source</span>
        <span class="pill">Project memory</span>
        <span class="pill">30 tools</span>
        <span class="pill">MCP clients</span>
      </div>
      <span class="dom">luti.aouos.com</span>
    </div>
  </div>
</body>
</html>
